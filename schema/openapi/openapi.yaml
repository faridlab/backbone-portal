components:
  schemas:
    PortalAuditLog:
      type: object
      required:
        - id
        - event
        - occurred_at
        - metadata
      properties:
        id:
          type: string
          format: uuid
        event:
          type: string
        portal_user_id:
          nullable: true
          type: string
          format: uuid
        invite_id:
          nullable: true
          type: string
          format: uuid
        token_id:
          nullable: true
          type: string
          format: uuid
        actor:
          nullable: true
          type: string
          maxLength: 120
        detail:
          nullable: true
          type: object
        occurred_at:
          type: string
          format: date-time
        metadata:
          type: object

    PortalAuditLogBulkResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PortalAuditLog'
        total: { type: integer }
        failed: { type: integer }
        errors:
          type: array
          items: { type: string }

    CreatePortalAuditLogRequest:
      type: object
      required:
        - event
        - occurred_at
        - metadata
      properties:
        event:
          type: string
        portal_user_id:
          nullable: true
          type: string
          format: uuid
        invite_id:
          nullable: true
          type: string
          format: uuid
        token_id:
          nullable: true
          type: string
          format: uuid
        actor:
          nullable: true
          type: string
          maxLength: 120
        detail:
          nullable: true
          type: object
        occurred_at:
          type: string
          format: date-time
        metadata:
          type: object

    UpdatePortalAuditLogRequest:
      type: object
      required:
        - event
        - occurred_at
        - metadata
      properties:
        event:
          type: string
        portal_user_id:
          nullable: true
          type: string
          format: uuid
        invite_id:
          nullable: true
          type: string
          format: uuid
        token_id:
          nullable: true
          type: string
          format: uuid
        actor:
          nullable: true
          type: string
          maxLength: 120
        detail:
          nullable: true
          type: object
        occurred_at:
          type: string
          format: date-time
        metadata:
          type: object

    PatchPortalAuditLogRequest:
      type: object
      properties:
        event:
          type: string
        portal_user_id:
          nullable: true
          type: string
          format: uuid
        invite_id:
          nullable: true
          type: string
          format: uuid
        token_id:
          nullable: true
          type: string
          format: uuid
        actor:
          nullable: true
          type: string
          maxLength: 120
        detail:
          nullable: true
          type: object
        occurred_at:
          type: string
          format: date-time
        metadata:
          type: object

    PortalAuditLogList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PortalAuditLog'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    PortalInvite:
      type: object
      required:
        - id
        - recipient_email
        - token_nonce
        - token_expires_at
        - status
        - metadata
      properties:
        id:
          type: string
          format: uuid
        recipient_email:
          type: string
          maxLength: 320
